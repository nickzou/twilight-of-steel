# Local development only. Compose loads this automatically with a plain
# `docker compose up`; production passes -f explicitly, so it is never used
# there (and deploys don't copy it to the server).
#
# Mounts the theme and the site plugin over the copies baked into the image, so edits show up on
# refresh without a rebuild.

services:
  wordpress:
    volumes:
      - ./twilight-of-steel:/var/www/html/wp-content/themes/twilight-of-steel:ro
      - ./plugins/twilight-of-steel-core:/var/www/html/wp-content/plugins/twilight-of-steel-core:ro
