name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /srv/twilight-of-steel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose files
        run: |
          scp -i ~/.ssh/id_deploy compose.yaml compose.prod.yaml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
      - name: Pull and restart
        # -V recreates the anonymous /var/www/html volume so the new image's
        # theme and plugins are used. uploads and the database are named volumes
        # and are kept.
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_DIR && export IMAGE_TAG=${{ github.sha }} \
             && docker compose -f compose.yaml -f compose.prod.yaml pull \
             && docker compose -f compose.yaml -f compose.prod.yaml up -d -V --remove-orphans \
             && docker image prune -f"
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-delay 5 --retry-all-errors \
            https://www.twilightofsteel.com/
